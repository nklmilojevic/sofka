name: Setup Nix
description: Install Nix with flakes enabled and wire up the nkl-sofka Cachix cache

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ github.token }}
      env:
        NIX_FIRST_BUILD_UID: 400

    - name: Setup Cachix
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: nkl-sofka
        authToken: ${{ env.CACHIX_AUTH_TOKEN }}
        skipPush: ${{ env.CACHIX_AUTH_TOKEN == '' }}
