name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate tag and Cargo version
        run: |
          version="${RELEASE_TAG#v}"
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$RELEASE_TAG' is not a release tag like v0.2.0"
            exit 1
          fi

          cargo_version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [[ "$cargo_version" != "$version" ]]; then
            echo "::error::Cargo.toml version '$cargo_version' does not match '$RELEASE_TAG'"
            exit 1
          fi

  # Cross-platform release binaries, one native build per target — every
  # target below is the runner's own host, so no cross-compilation toolchain
  # is needed.
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify Linux compatibility
        if: runner.os == 'Linux'
        run: |
          bin="target/${{ matrix.target }}/release/sofka"
          "$bin" --version

          max_glibc="$(
            objdump -T "$bin" \
              | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
              | sort -Vu \
              | tail -1
          )"
          echo "Maximum required glibc: $max_glibc"
          if ! dpkg --compare-versions "${max_glibc#GLIBC_}" le 2.35; then
            echo "::error::$bin requires $max_glibc;" \
              "expected GLIBC_2.35 or older"
            exit 1
          fi

      - name: Package
        run: |
          bin="target/${{ matrix.target }}/release/sofka"
          strip "$bin"
          out="sofka-${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
          tar -czf "$out" -C "$(dirname "$bin")" sofka
          echo "ASSET=$out" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  upload-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Upload release assets
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz --clobber

  # Kick the tap's bump workflow so `brew install nklmilojevic/sofka/sofka`
  # picks up the new version immediately instead of waiting for the tap's
  # 6-hourly cron (which stays as the fallback). Needs TAP_GITHUB_TOKEN, a
  # fine-grained PAT scoped to homebrew-sofka with Actions read/write.
  homebrew-bump:
    needs: upload-assets
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Dispatch tap bump
        run: |
          gh workflow run bump.yaml \
            -R nklmilojevic/homebrew-sofka \
            -f tag="$RELEASE_TAG"

  crates-publish:
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  # Warms the nkl-sofka Cachix cache for the tagged rev, so `nix build
  # github:nklmilojevic/sofka?ref=vX.Y.Z` is instant for anyone consuming
  # this tag afterward.
  nix-cache:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: macos-15-intel
    runs-on: ${{ matrix.os }}
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]

      # CI no longer runs any Nix job, so this is where flake/packaging
      # breakage surfaces.
      - name: Flake check
        run: nix flake check --no-build

      - name: Build and cache
        run: nix build .#sofka --print-build-logs
