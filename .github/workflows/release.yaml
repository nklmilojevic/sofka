name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate tag and Cargo version
        run: |
          version="${RELEASE_TAG#v}"
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$RELEASE_TAG' is not a release tag like v0.2.0"
            exit 1
          fi

          cargo_version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [[ "$cargo_version" != "$version" ]]; then
            echo "::error::Cargo.toml version '$cargo_version' does not match '$RELEASE_TAG'"
            exit 1
          fi

  build:
    needs: validate
    uses: $/.github/workflows/release-packages.yaml

  upload-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.12"

      - name: Verify all target SBOMs
        run: uv run --locked python scripts/release_packages.py verify-sboms --directory dist --version "${RELEASE_TAG#v}"

      - name: Generate checksums
        working-directory: dist
        run: shasum -a 256 -- *.tar.gz *.zip *.deb *.rpm *.apk *.pkg.tar.zst *.spdx.json > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst
            dist/*.spdx.json

      - name: Upload release assets
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/*.apk dist/*.pkg.tar.zst dist/*.spdx.json dist/SHA256SUMS --clobber

  # Kick the tap's bump workflow so `brew install nklmilojevic/sofka/sofka`
  # picks up the new version immediately instead of waiting for the tap's
  # 6-hourly cron (which stays as the fallback). Needs TAP_GITHUB_TOKEN, a
  # fine-grained PAT scoped to homebrew-sofka with Actions read/write.
  homebrew-bump:
    needs: upload-assets
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Dispatch tap bump
        run: |
          gh workflow run bump.yaml \
            -R nklmilojevic/homebrew-sofka \
            -f tag="$RELEASE_TAG"

  crates-publish:
    needs: upload-assets
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  # Warms the nkl-sofka Cachix cache for the tagged rev, so `nix build
  # github:nklmilojevic/sofka?ref=vX.Y.Z` is instant for anyone consuming
  # this tag afterward.
  nix-cache:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: macos-15-intel
    runs-on: ${{ matrix.os }}
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository]

      # CI no longer runs any Nix job, so this is where flake/packaging
      # breakage surfaces.
      - name: Flake check
        run: nix flake check --no-build

      - name: Build and cache
        run: nix build .#sofka --print-build-logs
