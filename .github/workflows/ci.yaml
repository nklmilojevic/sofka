name: CI

# PRs only. Pushes to main run no CI. Home Manager tests run here.
# The release workflow builds Nix packages for all four platforms and updates
# the Cachix cache. Package build failures can still first appear at release.
on:
  pull_request:

permissions:
  contents: read

jobs:
  home-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: $/.github/actions/setup-nix

      - name: Check flake outputs on all supported systems
        run: nix flake check --no-build --all-systems

      - name: Test Home Manager module
        run: nix build .#checks.x86_64-linux.home-manager --no-link --print-build-logs

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Test release packaging
        run: python3 -m unittest discover -s scripts -p 'test_release_licenses.py'

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview

      - name: Cache coverage build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage
          workspaces: . -> target/llvm-cov-target

      - name: Install coverage tool
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Generate coverage report
        run: cargo llvm-cov --locked --html

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: target/llvm-cov/html
          if-no-files-found: error
          retention-days: 14
