name: CI

# Home Manager tests run on PRs only. The Rust jobs also run on pushes to main:
# a GitHub cache saved on a PR ref is visible only to that PR, so main is the
# only place a kache store can be saved for every PR to restore. PR runs restore
# without saving, which keeps them from filling the repository's cache quota.
# The platforms job compiles all targets on Windows and runs the tests on macOS.
# The release workflow builds Nix packages for all four platforms and updates
# the Cachix cache. Package build failures can still first appear at release.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  home-manager:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: $/.github/actions/setup-nix

      - name: Check flake outputs on all supported systems
        run: nix flake check --no-build --all-systems

      - name: Test Home Manager module
        run: nix build .#checks.x86_64-linux.home-manager --no-link --print-build-logs

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust compilation
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.1.1 # renovate: depName=kunobi-ninja/kache
          cache-key-prefix: ci-rust-${{ steps.toolchain.outputs.cachekey }}
          cache-dir: ${{ runner.temp }}/kache
          save-cache: ${{ github.event_name == 'push' }}
          pr-comment: false

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy (bench feature)
        run: cargo clippy --locked --features bench,dhat-heap --benches --examples -- -D warnings

      - name: Test
        run: cargo test --locked

  platforms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            run: cargo test --locked
          - os: windows-latest
            run: cargo check --locked --all-targets
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Rust compilation
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.1.1 # renovate: depName=kunobi-ninja/kache
          cache-key-prefix: ci-platforms-${{ steps.toolchain.outputs.cachekey }}
          cache-dir: ${{ runner.temp }}/kache
          cache-executables: ${{ runner.os == 'Windows' }}
          save-cache: ${{ github.event_name == 'push' }}
          pr-comment: false

      - name: Build and test
        run: ${{ matrix.run }}

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust compilation
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.1.1 # renovate: depName=kunobi-ninja/kache
          cache-key-prefix: ci-coverage-${{ steps.toolchain.outputs.cachekey }}
          cache-dir: ${{ runner.temp }}/kache
          save-cache: ${{ github.event_name == 'push' }}
          pr-comment: false

      - name: Install coverage tool
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Generate coverage report
        run: cargo llvm-cov --locked --html

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: target/llvm-cov/html
          if-no-files-found: error
          retention-days: 14
